<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
  <meta http-equiv="Pragma" content="no-cache"/>
  <meta http-equiv="Expires" content="0"/>
  <title>Zara Aura – Fashion Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600&family=Montserrat:wght@200;300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20260515d" />

  <!-- Auto-fix white screen: if JS crashes due to old cached files, force a fresh reload -->
  <script>
    window.onerror = function(msg, src, line, col, err) {
      var key = '_za_reload';
      if (!sessionStorage.getItem(key)) {
        sessionStorage.setItem(key, '1');
        var fresh = location.pathname + '?t=' + Date.now();
        location.replace(fresh);
      }
    };
  </script>

  <style>
    /* Loading screen — shown until app.js renders the real UI */
    #app-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #faf8f4;
      font-family: 'Montserrat', sans-serif;
    }
    #app-loading .za-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.6rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    #app-loading .za-logo span { color: #c8a97e; }
    #app-loading .za-sub {
      font-size: 0.75rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #9e8c76;
      margin-top: 6px;
    }
    #app-loading .za-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #c8a97e;
      margin-top: 28px;
      animation: zadot 1.2s ease-in-out infinite;
    }
    @keyframes zadot {
      0%,100% { opacity: 0.2; transform: scale(0.8); }
      50%      { opacity: 1;   transform: scale(1.2); }
    }
  </style>
</head>
<body>
  <!-- Loading screen: visible until JS replaces #app content -->
  <div id="app">
    <div id="app-loading">
      <div class="za-logo"><span>ZARA</span> Aura</div>
      <div class="za-sub">Fashion Management</div>
      <div class="za-dot"></div>
    </div>
  </div>
  <div id="toast-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" crossorigin="anonymous"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="backend-config.js"></script>
  <script src="app.js?v=20260515d"></script>
</body>
</html>
